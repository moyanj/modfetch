# 含 feature / only_version 过滤的配置
# mods 数组支持异构：dict 条目与字符串混写（TOML 1.0 标准，tomllib/tomli 支持）
[minecraft]
version = ["1.21.1"]
mod_loader = "fabric"
mods = [
    "sodium",
    { id = "fabric-api", feature = "opt" },
    { slug = "sodium", version = "0.6.0", only_version = "1.21.1" },
]

[output]
download_dir = "downloads"
format = ["mrpack"]
