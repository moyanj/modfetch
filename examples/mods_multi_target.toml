# =====================================================================
# ModFetch 多版本 × 多加载器矩阵构建示例
#
# 用途：一份配置同时为「多个 Minecraft 版本 × 多个加载器」构建，
# 生成笛卡尔积数量个 target（如 2 版本 × 2 加载器 = 4 个），每个
# target 产出独立的 mrpack/zip 包（命名带 mc{版本}-{加载器}）。
#
# 注意：多加载器下，模组需在各加载器都存在对应版本。示例选用
# fabric + forge 双支持的模组（若用 sodium/modmenu 这类仅 fabric
# 的模组，forge target 会解析失败并记入 skipped）。
# =====================================================================

[metadata]
name = "Multi Target Pack"
version = "3.1.0"
description = "演示多版本 × 多加载器矩阵构建与多格式输出"

[minecraft]
# 多版本
version = ["1.21.1", "1.20.4"]

# 多加载器 → 每版本 × 每加载器各构建一次
mod_loader = ["fabric", "forge"]

mods = [
    # 下列模组同时支持 fabric 与 forge（已按真实 Modrinth 数据验证）
    "journeymap",
    "chat-heads",
    "entityculling",
    "dynamic-fps",
    "controlling",
    "no-chat-reports",
    "sound-physics-remastered",
    # 仅 1.21.1 兼容的条目用 only_version 精确限制（其余版本自动跳过）
    { id = "spark", only_version = "1.21.1" },
]

[output]
download_dir = "./downloads"

# 多种格式同时产出
format = ["mrpack", "zip"]

# mrpack 同时生成「全量下载版」与「引用版」→ 产物名带 -download / -reference 后缀
mrpack_modes = ["download", "reference"]

# 参考产物布局（2 版本 × 2 加载器 × 2 格式，mrpack 双模式 → 每 target 3 产物）：
#   dist/multi-target-pack-3.1.0-mc1.21.1-fabric.mrpack          (单模式无后缀)
#   dist/multi-target-pack-3.1.0-mc1.21.1-fabric-download.mrpack
#   dist/multi-target-pack-3.1.0-mc1.21.1-fabric-reference.mrpack
#   dist/multi-target-pack-3.1.0-mc1.21.1-fabric.zip
#   dist/multi-target-pack-3.1.0-mc1.21.1-forge.mrpack
#   ... 依此类推（共 2×2×3 = 12 个产物）
